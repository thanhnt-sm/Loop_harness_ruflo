name: supply-chain

# Task 3.7: Supply Chain Integrity — SBOM + cosign + hash-pinned install.
# Chạy trên mọi PR + push tới main. Chặn merge nếu:
#   - SBOM drift (package cài đặt không khớp SBOM)
#   - requirements-lock.txt thiếu hash
#   - Artifact release không có chữ ký cosign hợp lệ

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless cosign signing (GitHub OIDC)

jobs:
  sbom-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (hash-pinned, fail on drift)
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Verify SBOM vs installed
        run: |
          python .devin/scripts/sbom_verify.py --sbom sbom/python.sbom.json --skip-installed

      - name: Regenerate + diff SBOM (detect undeclared deps)
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment -o /tmp/python.sbom.json
          python - <<'EOF'
          import json
          a = json.load(open("sbom/python.sbom.json"))
          b = json.load(open("/tmp/python.sbom.json"))
          na = {c.get("name") for c in a.get("components", [])}
          nb = {c.get("name") for c in b.get("components", [])}
          diff = sorted(nb - na)
          if diff:
              raise SystemExit(f"SBOM drift: missing components {diff}")
          print("SBOM drift check PASSED")
          EOF

  cosign-verify:
    runs-on: ubuntu-latest
    needs: sbom-verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Verify SBOM signatures (keyless OIDC)
        run: |
          bash .devin/scripts/cosign_verify.sh sbom/python.sbom.json
          bash .devin/scripts/cosign_verify.sh sbom/npm.sbom.json

  release-sign:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: sbom-verify
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign SBOMs (keyless)
        run: |
          cosign sign-blob --yes --bundle sbom/python.sbom.bundle sbom/python.sbom.json
          cosign sign-blob --yes --bundle sbom/npm.sbom.bundle sbom/npm.sbom.json
      - name: Attach bundles to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom/*.bundle
            sbom/*.sbom.json
            requirements-lock.txt