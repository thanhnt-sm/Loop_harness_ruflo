name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # AHD Python test suite + hook integrity + workspace verify
  ahd-python:
    name: AHD Python Tests & Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov hypothesis pydantic bandit

      - name: Bandit SAST (fail on High, report Medium/Low)
        run: |
          set -e
          python -m bandit -q -r .devin/scripts .devin/hooks tools -f txt \
            || bandit_rc=$? || true
          # R-10: chặn High; Medium/Low chỉ báo cáo (giữ fail-open cho false-positive)
          python -m bandit -q -r .devin/scripts .devin/hooks tools -f json > /tmp/bandit.json || true
          python - <<'EOF'
          import json
          with open('/tmp/bandit.json') as f:
              data = json.load(f)
          sev = {}
          for r in data.get('results', []):
              sev[r['issue_severity']] = sev.get(r['issue_severity'], 0) + 1
          print(f"bandit: High={sev.get('High',0)} Medium={sev.get('Medium',0)} Low={sev.get('Low',0)}")
          if sev.get('High', 0) > 0:
              raise SystemExit(f"FAIL: {sev['High']} High-severity bandit findings")
          EOF

      - name: Hook integrity verify (hash baseline)
        run: python .devin/scripts/hook_integrity.py --verify

      - name: Hook integrity verify (chain order)
        run: python .devin/scripts/hook_integrity.py --verify-order

      - name: Workspace verify (PowerShell equivalent on Linux)
        run: |
          # verify-workspace.ps1 is Windows-only; run equivalent shell checks.
          set -e
          for d in .devin/canon .devin/skills .devin/agents .devin/hooks .devin/scripts HLK tools; do
            if [ ! -d "$d" ]; then echo "FAIL: missing $d"; exit 1; fi
            echo "OK: $d exists"
          done
          for f in AGENTS.md CLAUDE.md .devin/config.json; do
            if [ ! -f "$f" ]; then echo "FAIL: missing $f"; exit 1; fi
            echo "OK: $f exists"
          done
          echo "Workspace verify passed"

      - name: Workspace governance check
        run: python tools/check_governance.py

      - name: Run pytest (no coverage gate in CI — coverage tracked locally)
        run: |
          pytest tests/ -q --tb=short --override-ini="addopts=-ra" 2>&1 || pytest_exit=$?
          echo "pytest exit code: ${pytest_exit:-0}"
          if [ -n "$pytest_exit" ] && [ "$pytest_exit" != "0" ]; then
            echo "--- Collection check ---"
            pytest tests/ --co -q --override-ini="addopts=" 2>&1 | tail -30
            exit $pytest_exit
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ahd-python-coverage
          path: |
            .coverage
            htmlcov/
          if-no-files-found: ignore
