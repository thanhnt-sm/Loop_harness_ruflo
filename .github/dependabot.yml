version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "ruvnet"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ruvnet"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for pip dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ruvnet"
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Các package bị ignore để không làm hỏng hash-pinned lock + CI:
    # - filelock: PIN <3.13 (documented) — filelock 3.13+ eager import asyncio (~6s)
    #   làm hook vượt timeout 2.5s. Không bao giờ bump độc lập.
    # - pydantic-core: pydantic==2.x pin CHÍNH XÁC version (==) nên bump độc lập
    #   tạo conflict ResolutionImpossible → supply-chain "Install deps" fail.
    # - typing-extensions/typing-inspection: transitive pin của pydantic/pydantic-core.
    ignore:
      - dependency-name: "filelock"
      - dependency-name: "pydantic-core"
      - dependency-name: "typing-extensions"
      - dependency-name: "typing-inspection"
    # Nhóm pydantic + các transitive pin liên quan để bump cùng nhau nếu cần.
    groups:
      pydantic:
        patterns:
          - "pydantic*"
