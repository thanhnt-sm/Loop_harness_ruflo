# Cấu hình pytest cho AHD (Agent Harness Deploy).
# File này khai báo nơi chứa test, tùy chọn chạy và cổng coverage (tỷ lệ code được test phủ).
# Giữ file ngắn gọn, dễ hiểu cho người không chuyên kỹ thuật.

[pytest]
# Các thư mục chứa test: tests chính, script tiện ích và hook guard của AHD.
testpaths =
    tests
    .devin/scripts
    .devin/hooks

# Tùy chọn mặc định khi chạy pytest:
# - -ra                : tóm tắt ngắn gọn kết quả test (skip, xfail, error...).
addopts =
    -ra

# Quy ước tên file/hàm test để pytest tự nhận diện.
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Filter warning: tắt các cảnh báo ồn ào không liên quan đến test chính.
filterwarnings =
    ignore::DeprecationWarning

# Cấu hình Hypothesis (property-based test): giới hạn ví dụ để chạy nhanh trong CI.
# - max_examples=100: mỗi property sinh 100 ví dụ ngẫu nhiên (mặc định 200).
# - deadline=None: tắt giới hạn thời gian mỗi ví dụ (tránh false fail trên máy chậm).
[hypothesis]
max_examples = 100
deadline = disabled
