# pyproject.toml — metadata dự án và khai báo dependency cho AHD.
# File này tuân theo chuẩn PEP 518/621, dùng bởi pip và các công cụ build.
# Giữ tối giản: chỉ khai báo metadata tối thiểu + dependency tùy chọn cho nhóm test.

[build-system]
# Dùng setuptools làm backend build (phổ biến, ổn định).
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ahd-loop-harness"
version = "0.1.0"
description = "Agent Harness Deploy (AHD) — loop harness cho Devin CLI."
readme = "AGENTS.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "AHD Team" },
]
keywords = ["agent", "harness", "devin", "loop"]

# Dependency bắt buộc: giữ tối thiểu để không tăng khối lượng cài đặt.
# - filelock: HARD dependency (CVE-2026-AHD-003) — idempotency fail-closed
#   cần filelock làm lock backend; nếu thiếu, register() từ chối chạy (raise).
# - <3.13: filelock 3.13+ eagerly import asyncio (~6s import trên máy chậm)
#   làm mọi hook (schema_gate, pre_tool_use...) vượt timeout 2.5s. 3.12.x
#   không import asyncio (~0.5s). Pin chặn regression.
# - cryptography: HARD dependency (CVE-2026-AHD-006) — approval_gate cần
#   Ed25519 verify chữ ký reviewer; thiếu -> không thể verify -> fail closed.
dependencies = [
    "pydantic>=2.0",
    "filelock>=3.0,<3.33",
    "cryptography>=41.0",
]

# Dependency tùy chọn theo nhóm:
# - [test] : chạy pytest, đo coverage, property-based test (hypothesis), khóa file (filelock).
# - [redis] : distributed lock cho idempotency (CVE-2026-AHD-003 multi-node).
[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "pydantic>=2.0",
    "filelock>=3.0,<3.33",
]
redis = [
    "redis>=5.0",
]

# Cấu hình công cụ (tùy chọn, không bắt buộc phải có để chạy test).

# mypy: kiểm tra kiểu tĩnh (static type checking) — tắt strict để không chặn CI.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false

# ruff: linter + formatter nhanh, quy tắc nhẹ nhàng.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Chỉ bật nhóm quy tắc cơ bản (E/pycodestyle, F/pyflakes) để tránh ồn.
select = ["E", "F"]
ignore = ["E501"]

# Hypothesis: cấu hình profile mặc định cho property-based test.
[tool.hypothesis]
max_examples = 100
deadline = "disabled"

# Coverage: cấu hình bổ sung cho pytest-cov, ưu tiên theo thứ tự .coveragerc > pyproject.toml > pytest.ini.
[tool.coverage.run]
source = [".devin", "tools"]
omit = [
    "*/tests/*",
    "*/test_*/*",
    "HLK/*",
    ".devin/state/*",
    ".devin/plan_state/*",
    ".devin/loop_state/*",
    ".devin/session_state/*",
    ".devin/telemetry/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
